name: PDCA Prebuilt Windows Package

on:
  push:
    branches:
      - codex/prebuilt-windows-package
  pull_request:
    branches:
      - codex/build-increment-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package on Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install locked packages and run regression tests
        shell: pwsh
        run: |
          node --version
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Automated regression tests failed' }
      - name: Stage package, record checksums and create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'pdca-prebuilt-stage'
          $dist = Join-Path $env:RUNNER_TEMP 'pdca-prebuilt-dist'
          New-Item -Path $dist -ItemType Directory -Force | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          node tools/prebuilt/package.mjs $stage $sha
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          node tools/prebuilt/verify.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'Package staging verification failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $dist ('PDCA-Windows-' + $sha.Substring(0, 12) + '.zip')
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $checksum = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zip + '.sha256') -Value ($checksum + '  ' + (Split-Path $zip -Leaf)) -NoNewline
          Write-Host ('Built archive: ' + (Split-Path $zip -Leaf))
      - name: Hold unverified candidate for second runner
        uses: actions/upload-artifact@v4
        with:
          name: pdca-prebuilt-candidate
          path: ${{ runner.temp }}/pdca-prebuilt-dist/*
          retention-days: 7
          if-no-files-found: error

  clean-machine:
    name: Verify on independent Windows runner (no npm)
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Install only Node.js 24 (no repository checkout or npm ci)
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Download generated ZIP and checksum
        uses: actions/download-artifact@v4
        with:
          name: pdca-prebuilt-candidate
          path: ${{ runner.temp }}/pdca-prebuilt-download
      - name: Check archive hash, package files and run runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'pdca-prebuilt-download'
          $zip = Get-ChildItem -LiteralPath $download -Filter 'PDCA-Windows-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Candidate ZIP was not downloaded' }
          $expected = (Get-Content -LiteralPath ($zip.FullName + '.sha256') -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Archive SHA-256 mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'pdca-clean-machine-extract'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          node (Join-Path $extract 'tools/prebuilt/verify.mjs') $extract
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          node (Join-Path $extract 'tools/prebuilt/smoke.mjs') $extract
          if ($LASTEXITCODE -ne 0) { throw 'Clean-runner smoke failed' }
      - name: Publish verified delivery candidate
        uses: actions/upload-artifact@v4
        with:
          name: PDCA-Prebuilt-Windows-Verified
          path: ${{ runner.temp }}/pdca-prebuilt-download/*
          retention-days: 14
          if-no-files-found: error
