name: PDCA Direct-IP verified Windows candidate (not release)
on:
  push:
    branches: [codex/direct-private-ip-implementation]
    paths:
      - '.github/workflows/direct-prebuilt.yml'
      - 'tools/prebuilt/package.mjs'
      - 'tools/prebuilt/verify.mjs'
      - 'README4IT.html'
  workflow_dispatch:
permissions:
  contents: read
env:
  ACCEPTED_SOURCE: ${{ github.sha }}
jobs:
  build-candidate:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Verify exact source and install locked dependencies (source regression is separate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:ACCEPTED_SOURCE) { throw 'Wrong source SHA' }
          if ((node --version).Trim() -ne 'v24.11.0') { throw 'Wrong Node version' }
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Build pinned source archive and separately prepare QA harness
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'direct-stage'
          $dist = Join-Path $env:RUNNER_TEMP 'direct-dist'
          $qa = Join-Path $env:RUNNER_TEMP 'direct-qa'
          New-Item -ItemType Directory -Path $dist,(Join-Path $qa 'tools/qa'),(Join-Path $qa 'src'),(Join-Path $qa 'test') | Out-Null
          node tools/prebuilt/package.mjs $stage $env:ACCEPTED_SOURCE --direct
          if ($LASTEXITCODE -ne 0) { throw 'Stage failed' }
          node tools/prebuilt/verify.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'Stage manifest failed' }
          $manifest = Get-Content (Join-Path $stage 'DEPLOYMENT_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:ACCEPTED_SOURCE -or $manifest.profile -ne 'direct-ip') { throw 'Wrong manifest source/profile' }
          $bad = Get-ChildItem $stage -Recurse -Force -File | Where-Object { $_.Name -match '(^host\.env$|^\.env($|\.)|\.sqlite($|-)|\.db$|^active-db\.json$|^operations\.jsonl$|\.pem$|\.pfx$|\.key$)' -and $_.FullName -notlike '*\node_modules\*' }
          if ($bad) { throw 'Unexpected runtime state or key file in package' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $dist ('PDCA-Direct-Windows-CANDIDATE-' + $env:ACCEPTED_SOURCE.Substring(0,12) + '.zip')
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zip+'.sha256') -Value ($sha+'  '+(Split-Path $zip -Leaf)) -NoNewline
          "archive_sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host ("Direct ARCHIVE BUILT: source="+$env:ACCEPTED_SOURCE+" sha256="+$sha+" bytes="+(Get-Item $zip).Length+" files="+$manifest.files.Count)
          $template = [IO.File]::ReadAllText((Join-Path $stage 'README4IT.html'))
          if ([regex]::Matches($template,'const DELIVERY = null;').Count -ne 1) { throw 'Missing unique guide metadata marker' }
          $delivery = @{source=$env:ACCEPTED_SOURCE;zip=(Split-Path $zip -Leaf);sha256=$sha} | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $dist 'README4IT.html'),$template.Replace('const DELIVERY = null;',('const DELIVERY = '+$delivery+';')),[Text.UTF8Encoding]::new($false))
          Copy-Item tools/qa/direct-edge.mjs,tools/qa/direct-endpoint-preflight.mjs,tools/qa/it-guide-commands.mjs (Join-Path $qa 'tools/qa')
          Copy-Item src/network-config.js (Join-Path $qa 'src')
          Copy-Item test/direct-lan.test.js,test/recovery-operator.test.js (Join-Path $qa 'test')
          Copy-Item package.json (Join-Path $qa 'package.json')
      - uses: actions/upload-artifact@v4
        with:
          name: Direct-Candidate-NOT-RELEASE
          path: ${{ runner.temp }}/direct-dist/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Direct-QA-harness
          path: ${{ runner.temp }}/direct-qa
          retention-days: 7
          if-no-files-found: error
  clean-target:
    name: clean-target (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['24.11.0', '24.14.1']
    needs: build-candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Provision prerequisite Node only (no checkout)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: Direct-Candidate-NOT-RELEASE
          path: ${{ runner.temp }}/direct-download
      - uses: actions/download-artifact@v4
        with:
          name: Direct-QA-harness
          path: ${{ runner.temp }}/direct-qa
      - name: Verify archive and run clean target from isolated Node PATH (Windows PowerShell 5.1)
        shell: powershell
        env:
          EXPECTED_ARCHIVE_SHA: ${{ needs.build-candidate.outputs.archive_sha256 }}
          TARGET_NODE: ${{ matrix.node }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required by guide test' }
          Write-Host ('GUIDE TARGET SHELL: Windows PowerShell ' + $PSVersionTable.PSVersion)
          $download = Join-Path $env:RUNNER_TEMP 'direct-download'
          $qa = Join-Path $env:RUNNER_TEMP 'direct-qa'
          $zips = @(Get-ChildItem -LiteralPath $download -Filter '*.zip')
          if ($zips.Count -ne 1) { throw 'Expected exactly one candidate ZIP' }
          $zip = $zips[0].FullName
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = ((Get-Content -LiteralPath ($zip+'.sha256') -Raw).Trim() -split '\s+')
          if ($sidecar.Count -ne 2 -or $sidecar[0] -ne $actual -or $sidecar[1] -ne $zips[0].Name -or $actual -ne $env:EXPECTED_ARCHIVE_SHA) { throw 'Archive checksum/provenance mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'direct-clean extract'
          if (Test-Path $extract) { throw 'Target is not clean' }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $manifest = Get-Content (Join-Path $extract 'DEPLOYMENT_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:ACCEPTED_SOURCE -or $manifest.profile -ne 'direct-ip' -or $manifest.build.nodeVersion -ne 'v24.11.0') { throw 'Unexpected manifest provenance' }
          $guide = Join-Path $download 'README4IT.html'
          $template = [IO.File]::ReadAllText((Join-Path $extract 'README4IT.html'))
          $outerGuide = [IO.File]::ReadAllText($guide)
          $match = [regex]::Match($outerGuide,'const DELIVERY = (\{[^\r\n]+\});')
          if (-not $match.Success -or $outerGuide.Replace($match.Value,'const DELIVERY = null;') -cne $template) { throw 'External guide differs beyond delivery metadata' }
          $delivery = $match.Groups[1].Value | ConvertFrom-Json
          if ($delivery.source -cne $env:ACCEPTED_SOURCE -or $delivery.zip -cne $zips[0].Name -or $delivery.sha256 -cne $actual) { throw 'External guide delivery metadata mismatch' }
          $nodeOnly = Join-Path $env:RUNNER_TEMP 'direct-node-only'
          New-Item -ItemType Directory -Path $nodeOnly | Out-Null
          Copy-Item (Get-Command node.exe -ErrorAction Stop).Source (Join-Path $nodeOnly 'node.exe')
          $env:PATH = "$nodeOnly;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          foreach ($key in @('NODE_PATH','NODE_OPTIONS','npm_execpath','npm_node_execpath','NPM_CONFIG_USERCONFIG')) { Remove-Item "Env:$key" -ErrorAction SilentlyContinue }
          $env:npm_config_offline = 'true'
          $env:npm_config_registry = 'http://127.0.0.1:1/'
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP 'direct-empty-npm-cache'
          Set-Location -LiteralPath $extract
          if (Get-Command npm,npm.cmd,npx,npx.cmd,corepack,corepack.cmd -ErrorAction SilentlyContinue) { throw 'Package manager available on isolated PATH' }
          if ((Get-Command node.exe).Source -ne (Join-Path $nodeOnly 'node.exe')) { throw 'Unexpected Node executable' }
          if ((node --version).Trim() -ne ('v'+$env:TARGET_NODE)) { throw 'Wrong isolated runtime' }
          Write-Host ('DIRECT TARGET NODE: '+(node --version).Trim())
          Write-Host ("Direct ARCHIVE VERIFIED: sha256="+$actual+" source="+$manifest.sourceCommit+" files="+$manifest.files.Count)
          Write-Host 'Direct TARGET ISOLATION: no checkout; node.exe only; no npm/npx/corepack on PATH; offline npm config and loopback dead registry'
          # CI-only egress control on isolated Node executable, never on Factory.
          $ruleName = 'Direct-Block-Node-Internet-' + $env:GITHUB_RUN_ID
          New-NetFirewallRule -Name $ruleName -DisplayName $ruleName -Direction Outbound -Action Block -Program (Join-Path $nodeOnly 'node.exe') -RemoteAddress Internet -Profile Any -Enabled True | Out-Null
          try {
            $effective = Get-NetFirewallRule -PolicyStore ActiveStore -Name $ruleName -ErrorAction Stop
            if ($effective.Enabled -ne 'True' -or $effective.Action -ne 'Block') { throw 'CI egress rule is not active' }
            if (Get-NetFirewallProfile -PolicyStore ActiveStore | Where-Object Enabled -ne True) { throw 'CI firewall profile not enabled; egress control not verified' }
            Write-Host 'Direct CI EGRESS CONTROL: isolated Node executable blocked from Internet by active Windows firewall rule; local/private HTTP required'
            node tools/prebuilt/verify.mjs $extract
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package manifest failed' }
            # Temporary QA overlay: tests import the actual extracted runtime; no checkout.
            # Remove before final integrity check; tests are never in the delivery ZIP.
            $testDir = Join-Path $extract 'test'
            if (Test-Path $testDir) { throw 'Test directory leaked into delivery package' }
            try {
              Copy-Item -LiteralPath (Join-Path $qa 'test') -Destination $testDir -Recurse
              node --test test/direct-lan.test.js test/recovery-operator.test.js
              if ($LASTEXITCODE -ne 0) { throw 'Extracted Direct/Recovery regression failed' }
            } finally {
              if (Test-Path $testDir) { Remove-Item -LiteralPath $testDir -Recurse -Force }
            }
            node tools/prebuilt/verify.mjs $extract
            if ($LASTEXITCODE -ne 0) { throw 'QA overlay changed package' }
            $root = Join-Path $env:RUNNER_TEMP 'direct external data'
            $configDir = Join-Path $env:RUNNER_TEMP 'direct external config'
            New-Item -ItemType Directory -Path $root,$configDir | Out-Null
            $file = Join-Path $configDir 'host.env'
            $acl = (Get-Acl -LiteralPath $root).Sddl
            $selected = node (Join-Path $qa 'tools/qa/direct-endpoint-preflight.mjs')
            if ($LASTEXITCODE -ne 0) { throw 'Endpoint preflight failed' }
            $endpoint = $selected | ConvertFrom-Json
            & (Join-Path $extract 'tools/direct/setup.cmd') $file $endpoint.ip ([string]$endpoint.port) $root
            if ($LASTEXITCODE -ne 0) { throw 'First Setup failed' }
            $hash = (Get-FileHash -LiteralPath $file).Hash
            & (Join-Path $extract 'tools/direct/setup.cmd') $file
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $file).Hash -ne $hash) { throw 'Repeat Setup altered config' }
            & (Join-Path $extract 'tools/direct/diagnose.cmd') $file
            if ($LASTEXITCODE -ne 1 -or (Get-ChildItem -LiteralPath $root -Force)) { throw 'Pre-ADOPT guard failed' }
            node (Join-Path $qa 'tools/qa/direct-edge.mjs') $extract $file $guide
            if ($LASTEXITCODE -ne 0) { throw 'Actual extracted Edge/installation failed' }
            if ((Get-Acl -LiteralPath $root).Sddl -ne $acl) { throw 'Root ACL changed' }
            node tools/prebuilt/verify.mjs $extract
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package changed during runtime' }
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $actual) { throw 'Archive changed' }
            if (Test-Path $env:npm_config_cache) { throw 'Unexpected npm cache created' }
            # Exercise the actual generated guide commands on a separate synthetic dataset.
            # No firewall/policy changes, no automatic recovery credential use.
            $guideBase = Join-Path $env:RUNNER_TEMP 'PDCA Guide Test (Offline)'
            New-Item -ItemType Directory -Path $guideBase | Out-Null
            Copy-Item -LiteralPath $zip,($zip+'.sha256'),$guide -Destination $guideBase
            $selectedGuide = node (Join-Path $qa 'tools/qa/direct-endpoint-preflight.mjs')
            if ($LASTEXITCODE -ne 0) { throw 'Guide endpoint preflight failed' }
            $guideEndpoint = $selectedGuide | ConvertFrom-Json
            $guidePlanJson = node (Join-Path $qa 'tools/qa/it-guide-commands.mjs') $guide $guideBase $zips[0].Name $guideEndpoint.ip ([string]$guideEndpoint.port)
            if ($LASTEXITCODE -ne 0) { throw 'Guide command generation failed' }
            $guidePlan = $guidePlanJson | ConvertFrom-Json
            if (-not $guidePlan.prepare -or -not $guidePlan.setup) { throw 'Guide omitted required commands' }
            # Negative: correct ZIP but replaced sidecar must stop before extraction.
            $sidecarPath = Join-Path $guideBase ($zips[0].Name+'.sha256')
            $correctSidecar = [IO.File]::ReadAllText($sidecarPath)
            [IO.File]::WriteAllText($sidecarPath,(('0'*64)+'  '+$zips[0].Name))
            $rejected = $false
            try { & ([scriptblock]::Create($guidePlan.prepare)) } catch { if ($_.Exception.Message -match 'ZIP checksum mismatch') { $rejected = $true } else { throw } }
            if (-not $rejected -or (Test-Path -LiteralPath $guidePlan.app)) { throw 'Tampered sidecar was not rejected' }
            [IO.File]::WriteAllText($sidecarPath,$correctSidecar)
            & ([scriptblock]::Create($guidePlan.prepare))
            if (-not (Test-Path -LiteralPath (Join-Path $guidePlan.app 'DEPLOYMENT_MANIFEST.json'))) { throw 'Guide extraction failed' }
            # CI-only confirmation fixture: synthetic private endpoint and local runner-owned directories.
            # Production users must have actual IT permission and ACL confirmation.
            & {
              $allowAcl = $false
              function Read-Host {
                param([string]$Prompt)
                if ($Prompt -eq 'IT approved endpoint, synthetic data, stopped other writers? Type GO') { return 'GO' }
                if ($Prompt -eq 'IT verified actual ACL and empty data directory? Type GO') {
                  if (-not (Test-Path -LiteralPath $guidePlan.cfg -PathType Container) -or -not (Test-Path -LiteralPath $guidePlan.data -PathType Container) -or (Get-ChildItem -LiteralPath $guidePlan.data -Force)) { throw 'CI guide ACL precondition failed' }
                  Get-Acl -LiteralPath $guidePlan.cfg | Out-Null
                  Get-Acl -LiteralPath $guidePlan.data | Out-Null
                  if ($allowAcl) { return 'GO' } else { return 'NO' }
                }
                throw 'Unexpected guide confirmation prompt'
              }
              $paused = $false
              try { & ([scriptblock]::Create($guidePlan.setup)) } catch { if ($_.Exception.Message -match 'ACL not confirmed') { $paused = $true } else { throw } }
              if (-not $paused -or (Test-Path -LiteralPath $guidePlan.config) -or (Get-ChildItem -LiteralPath $guidePlan.cfg -Force) -or (Get-ChildItem -LiteralPath $guidePlan.data -Force)) { throw 'Interrupted setup did not preserve empty folders' }
              $allowAcl = $true
              & ([scriptblock]::Create($guidePlan.setup))
              Write-Host 'HTML GUIDE SAFE RESUME PASS: cancelled before config/seed, empty folders reused, no overwrite'
            }
            if (-not (Test-Path -LiteralPath $guidePlan.config -PathType Leaf)) { throw 'Guide config missing' }
            if (-not (Test-Path -LiteralPath (Join-Path $guidePlan.data 'demo.json'))) { throw 'Guide seed missing' }
            if (Test-Path Env:PDCA_DEMO_DIR) { throw 'Guide leaked ambient PDCA variable' }
            $repeatBlocked = $false
            try { & ([scriptblock]::Create($guidePlan.setup)) } catch { if ($_.Exception.Message -match 'config/data exists') { $repeatBlocked = $true } else { throw } }
            if (-not $repeatBlocked) { throw 'Guide repeat setup was not blocked' }
            node (Join-Path $guidePlan.app 'tools/prebuilt/verify.mjs') $guidePlan.app
            if ($LASTEXITCODE -ne 0) { throw 'Guide package changed' }
            Write-Host 'HTML GUIDE COMMANDS PASS: pinned external guide and inner template, spaced path, automatic ZIP/sidecar verification and tamper refusal, synthetic setup/seed, repeat refused, manifest intact'
            Write-Host 'Direct CLEAN TARGET PASS: exact archive and manifest, isolated Node runtime, extracted Direct/Recovery regression, Setup/Seed/ADOPT/Diagnose/Start/Edge, restart, ACL and unchanged package; no npm command in target'
          } finally {
            Remove-NetFirewallRule -Name $ruleName -ErrorAction Stop
          }
