/* A generous native scrollbar target stays fixed as its visible thumb grows. */
.board-viewport { cursor: grab; scrollbar-width: auto; scrollbar-color: auto; }
.board-viewport.panning, .board-viewport.panning * { cursor: grabbing !important; user-select: none; }
.board-viewport::-webkit-scrollbar { width: 18px; height: 18px; }
.board-viewport::-webkit-scrollbar-track, .board-viewport::-webkit-scrollbar-corner { background: var(--bg); }
.board-viewport::-webkit-scrollbar-thumb { border: 5px solid var(--bg); background: #778da9; border-radius: 20px; }
.board-viewport::-webkit-scrollbar-thumb:hover, .board-viewport::-webkit-scrollbar-thumb:active { border-width: 2px; background: #586f8d; }
.topbar.hidden:focus-within { margin-top: 0; opacity: 1; }
.head-select.case { width: clamp(190px, 29vw, 360px); max-width: 38vw; font-size: 13px; }
.node, .node.selected { animation: none; }
.action-head { min-height: 16px; max-height: none; }
.node.action .card-title { padding-top: 3px; }
.handle.left { left: -6px; }
.handle.right { right: -6px; }
.handle:hover { width: 12px; height: 12px; }
.magnet-target .handle.left { background: #26bd83; box-shadow: 0 0 0 5px #25bb8259, 0 0 20px #23cd90; }
.world-links { --edge: #617f9e; }

.world-links path.edge-hit { stroke: transparent; stroke-width: 9; pointer-events: stroke; cursor: pointer; }
.world-links path.edge-ink { pointer-events: none; stroke: var(--edge); stroke-width: 2; opacity: 1; filter: none; }
.status-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.status-filter legend { font-weight: 750; padding: 0 4px; }
.status-choice { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.status-choice input { accent-color: var(--accent); }
.status-filter-actions { display: flex; gap: 6px; margin-left: auto; }
.action-overview .rowlist { overflow-x: auto; }
.action-overview .rowlist .row { min-width: 520px; }
.action-overview .filtered-actions .row { border-top: 1px solid var(--line); background: transparent; font-weight: 400; }
.world-links path.preview, .world-links path.magnetic { stroke: var(--accent); stroke-width: 2; pointer-events: none; }
.world-links path.magnetic { stroke: #26bd83; }
.edge-label { text-anchor: middle; font-size: 11px; font-weight: 700; fill: var(--ink); stroke: var(--bg); stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; pointer-events: visiblePainted; cursor: pointer; }
.edge-list { display: grid; gap: 6px; margin: 10px 0 16px; }
.edge-list button { text-align: left; white-space: normal; overflow-wrap: anywhere; }
.title-measure { position: fixed; left: -10000px; top: 0; visibility: hidden; overflow-wrap: anywhere; font-size: calc(12.8px * var(--fontscale)); line-height: 1.33; font-weight: 550; }
.title-measure.action { font-weight: 600; }
#edgeDialog { padding: 0; border: 0; border-radius: 16px; background: transparent; color: var(--ink); width: min(430px, calc(100vw - 32px)); }
#edgeDialog::backdrop { background: #0d182778; }
#edgeDialog h3 { margin: 14px 0 10px; }
.edge-endpoints { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; font-size: 13px; align-items: center; }
#deleteEdge { margin-right: auto; color: var(--accent); }
#cancelEdge { order: 1; }
#saveEdge { order: 2; }
#routeStatus { color: var(--accent); }
@media (max-width: 1220px) { .tools .btn.hide-medium { display: inline-block; } }
@media (max-width: 640px) { .canvas-tip { display: none; } .subhead { height: auto; min-height: 64px; } }

.version-tag { color: var(--accent); letter-spacing: .04em; }
.node.related-category { border-color: var(--nodecolor); box-shadow: 0 0 0 1px color-mix(in srgb, var(--nodecolor) 62%, transparent), 0 0 21px 5px color-mix(in srgb, var(--nodecolor) 34%, transparent), var(--shadow); }
.world-links path.edge-ink { stroke: var(--route-color, var(--edge)); }
.world-links .edge-control:hover .edge-ink, .world-links .edge-control:focus-visible .edge-ink { stroke: var(--route-color, var(--edge)); filter: drop-shadow(0 0 2px var(--route-color)); }
.edge-control.edge-muted { opacity: .25; }
.edge-control.edge-muted:hover, .edge-control.edge-muted:focus-visible { opacity: 1; }

.edge-moving .edge-control { opacity: .20; pointer-events: none; }
.edge-moving .edge-control.moving-endpoint { display: none; }
.world-links path.drag-trace { fill: none; stroke: var(--route-color, var(--edge)); stroke-width: 2; opacity: .65; pointer-events: none; }
.edge-palette { padding: 10px; margin: 0; border: 1px solid var(--line); border-radius: 10px; }
.edge-palette legend { padding: 0 5px; font-size: 11px; font-weight: 750; color: var(--muted); }
#edgePalette { display: flex; gap: 3px; flex-wrap: wrap; }
.edge-swatch { position: relative; display: grid; width: 30px; height: 30px; place-items: center; cursor: pointer; }
.edge-swatch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }

.workspace-open { color: var(--accent); font-size: 12px; font-weight: 750; }

[hidden] { display: none !important; }
.header-nav { display: flex; gap: 4px; align-items: center; flex: none; }
.header-nav .navbtn { width: auto; height: 33px; padding: 0 9px; font-size: 12px; font-weight: 700; }
.header-nav .navbtn.bottomnav { width: 31px; }
.subhead { height: auto; min-height: 56px; justify-content: space-between; padding-block: 8px; }
#canvasTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.snap-header { position: relative; overflow: hidden; flex: none; z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
#laneHeaderTrack { position: absolute; width: 100%; height: 46px; transform-origin: top left; user-select: none; }
#laneHeaderTrack .lane-head { position: absolute; top: 0; border: 1px solid var(--lane-border); }
#laneHeaderTrack .compact-lane { padding: 0; justify-content: center; }
#laneHeaderTrack .resize-lane { top: 6px; }
.node { transform-origin: top left; }
.node .card-title, .node.action .card-title { display: block; -webkit-line-clamp: unset; line-clamp: unset; min-height: 0; }
.node.trace-muted:not(.related-category) { opacity: .48; }
.node.trace-muted.related-category { opacity: .79; }
.node.trace-node { border-color: var(--nodecolor); box-shadow: 0 0 0 1px var(--nodecolor), 0 0 17px color-mix(in srgb, var(--nodecolor) 54%, transparent), var(--shadow); }
.node.trace-muted:hover { opacity: 1; }
.category-ribbons { position: absolute; inset: 0; filter: blur(16px); opacity: .18; overflow: visible; mix-blend-mode: multiply; }
.category-ribbons path { stroke-width: 40; stroke-linecap: round; fill: none; }
[data-theme="dark"] .category-ribbons { opacity: .25; mix-blend-mode: screen; }
.node-figure { display: block; flex: 0 0 56px; height: 56px; width: 100%; padding: 0; margin-top: 6px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: #1a2a40; cursor: zoom-in; }

#figureDialog::backdrop { background: #071321bf; }
.figure-panel { position: relative; margin: 0; padding: 14px; }
.figure-panel img { display: block; width: 100%; max-height: 72vh; object-fit: contain; }
.figure-panel figcaption { padding: 12px 4px 4px; font-size: 13px; }
#closeFigure { position: absolute; right: 20px; top: 20px; }
.workspace-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); align-items: start; gap: 20px; }

.board-viewport { scrollbar-gutter: stable; }
.workspace-tile { min-width: 0; }
.workspace-card-category { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 11px; }
#categoryManager { padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; }
#categoryManager summary { cursor: pointer; font-weight: 750; }
.category-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.overview-title { display: flex; gap: 18px; flex-wrap: wrap; justify-content: space-between; align-items: center; }

function findRoute(start, end, obstacles) {

    for (let i = 1; i < queue.length; i++) if (queue[i].score < queue[next].score) next = i;
    const step = queue.splice(next, 1)[0];
    if (step.cost !== best.get(key(step.x, step.y, step.direction))) continue;
    if (step.x === tx && step.y === ty) {

function addEdge(source, target) {

function installEdgeControls() {
  const dialog = $('edgeDialog');
  let downOnBackdrop = false;
  const onBackdrop = event => {
    const r = dialog.getBoundingClientRect();
    return event.target === dialog &&
      (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom);
  };
  dialog.addEventListener('pointerdown', event => { downOnBackdrop = onBackdrop(event); });
  dialog.addEventListener('click', event => {
    if (downOnBackdrop && onBackdrop(event)) dismissDialog(dialog);
    downOnBackdrop = false;
  });
  dialog.addEventListener('cancel', event => { event.preventDefault(); dismissDialog(dialog); });
  $('edgePalette').addEventListener('change', event => {
    if (edgeColors.some(([id]) => id === event.target.value)) draftEdgeColor = event.target.value;
  });
  $('drawerContent').addEventListener('click', event => {
    const edit = event.target.closest('[data-edit-edge]');
    if (edit) editEdge(Number(edit.dataset.editEdge));
    if (event.target.closest('[data-add-edge]')) addEdge(find(selected), find($('inspectorTarget').value));
  });
  $('links').addEventListener('click', event => {
    const edge = event.target.closest('[data-edge]');
    if (edge) editEdge(Number(edge.dataset.edge));
  });
  $('links').addEventListener('keydown', event => {
    const edge = event.target.closest('[data-edge]');
    if (!edge || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    editEdge(Number(edge.dataset.edge));
  });
  $('edgeDialog').querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    if (!edgeBeingEdited) return;
    edgeBeingEdited.label = $('edgeLabel').value.trim();
    edgeBeingEdited.color = draftEdgeColor;
    dismissDialog($('edgeDialog'));
    drawLinks();
    renderDrawer();
    toast('บันทึกสีและคำอธิบายเส้นแล้ว');
  });
  $('cancelEdge').addEventListener('click', () => dismissDialog($('edgeDialog')));
  $('deleteEdge').addEventListener('click', () => {
    const index = cur().edges.indexOf(edgeBeingEdited);
    if (index < 0) return;
    cur().edges.splice(index, 1);
    dismissDialog($('edgeDialog'));
    renderAll();
    toast('ลบเส้นเชื่อมแล้ว');
  });
  $('edgeDialog').addEventListener('close', () => { edgeBeingEdited = null; });
}

function renderOrbs(dim) {

function walkRelations(start, adjacent, getNext) {
  const nodes = new Set(start ? [start] : []), edges = new Set(), queue = [...nodes];
  for (let i = 0; i < queue.length; i++) {
    for (const edge of adjacent.get(queue[i]) || []) {
      edges.add(edge);
      const id = getNext(edge);
      if (!nodes.has(id)) { nodes.add(id); queue.push(id); }
    }
  }

function relationIndex(edges) {
  const incoming = new Map(), outgoing = new Map();
  for (const edge of edges) {
    if (!incoming.has(edge.to)) incoming.set(edge.to, []);
    if (!outgoing.has(edge.from)) outgoing.set(edge.from, []);
    incoming.get(edge.to).push(edge);
    outgoing.get(edge.from).push(edge);
  }
  return {incoming, outgoing};
}

function traceSelection() {
  const {incoming, outgoing} = relationIndex(cur().edges);
  const before = walkRelations(selected, incoming, edge => edge.from);
  const after = walkRelations(selected, outgoing, edge => edge.to);

  return weights.map((weight, i) => workspace.mode === 'snap' && workspace.collapsed[i]
    ? workspace.widths[i] : Math.max(145, Math.floor(scale * weight)));

  const primaryOutgoing = relationIndex(primaryEdges).outgoing;
  const groups = cats.map((_, cat) => workspace.nodes.filter(node => node.cat === cat));

      .filter(id => ranks.has(id)).sort((a, b) => ranks.get(a) - ranks.get(b));

  dialog.dataset.closing = 'true';
  dialog.animate([{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.92)'}],
    {duration: 165, easing: 'ease-in', fill: 'forwards'}).finished.catch(() => {}).then(() => {
    delete dialog.dataset.closing;
    dialog.close();
    dialog.getAnimations().forEach(animation => animation.cancel());
  });
}

function installFigureControls() {
  const dialog = $('figureDialog');
  const closeFigure = () => dismissDialog(dialog);
  $('cards').addEventListener('click', event => {
    const button = event.target.closest('[data-figure]');
    if (button) openFigure(find(button.dataset.figure));
  });
  $('closeFigure').addEventListener('click', closeFigure);
  dialog.addEventListener('cancel', event => { event.preventDefault(); closeFigure(); });
  dialog.addEventListener('click', event => {
    if (event.target === dialog) closeFigure();
  });
}

function layoutStage(dim) {
  const stage = $('stage'), viewport = $('viewport'), zoom = cur().zoom;
  stage.style.width = dim.width + 'px';
  stage.style.height = dim.height + 'px';
  stage.style.transform = `scale(${zoom})`;
  $('boardSize').style.width = Math.max(dim.width * zoom, viewport.clientWidth) + 'px';
  $('boardSize').style.height = Math.max(dim.height * zoom, viewport.clientHeight + 150) + 'px';
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  syncLaneHeader();
}

function updateZoom(value, clientX, clientY) {
  const viewport = $('viewport');
  const bounds = viewport.getBoundingClientRect();
  const x = clientX ?? bounds.left + viewport.clientWidth / 2;
  const y = clientY ?? bounds.top + viewport.clientHeight / 2;
  const world = screenToWorld({clientX: x, clientY: y});
  const zoom = Math.max(.35, Math.min(1.65, Math.round(value * 100) / 100));
  if (cur().zoom === zoom) return;
  cur().zoom = zoom;
  zoomScrollUntil = Date.now() + 180;
  layoutStage(boxDim());
  const stage = $('stage').getBoundingClientRect();
  viewport.scrollLeft += stage.left + world.x * zoom - x;
  viewport.scrollTop += stage.top + world.y * zoom - y;
}

function fit() {
  const viewport = $('viewport');
  const cards = [...visibleBoxes().values()];
  const width = Math.max(1, ...cards.map(card => card.x + card.w)) + 24;
  const height = Math.max(1, ...cards.map(card => card.y + card.h)) + 24;
  updateZoom(Math.min(1, viewport.clientWidth / width, viewport.clientHeight / height));
  viewport.scrollTo({left: 0, top: 0, behavior: 'instant'});
}

function installWheelZoom() {
  const viewport = $('viewport');
  let frame = 0, pending = null;
  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    if (drag || edgeDrag || resizeLane || !event.deltaY) return;
    const factor = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
    const delta = Math.max(-180, Math.min(180, event.deltaY * factor));
    const previousZoom = pending?.workspace === currentId ? pending.zoom : cur().zoom;
    const zoom = previousZoom * Math.exp(-delta * .0019);
    pending = {zoom, x: event.clientX, y: event.clientY, workspace: currentId};
    if (!frame) frame = requestAnimationFrame(() => {
      frame = 0;
      const change = pending;
      pending = null;
      if (change.workspace === currentId && page === 'canvas' && !drag && !edgeDrag && !resizeLane) {
        updateZoom(change.zoom, change.x, change.y);
      }
    });
  }, {passive: false});
}

function resetWhenFirst() {
  for (const workspace of cases.values()) {
    packSnap(workspace);
    for (const node of workspace.nodes) node.initialSnapY = node.snapY;
  }
}

$('zoomOut').addEventListener('click',()=>updateZoom(cur().zoom-.1));$('zoomIn').addEventListener('click',()=>updateZoom(cur().zoom+.1));$('zoomFit').addEventListener('click',fit);
$('closeDrawer').addEventListener('click',()=>{drawerOpen=false;renderDrawer()});
$('actionNav').addEventListener('click',()=>viewPage('actions'));$('canvasNav').addEventListener('click',()=>viewPage('canvas'));$('home').addEventListener('click',()=>viewPage('workspace'));$('helpNav').addEventListener('click',()=>viewPage('help'));

$('overlay').addEventListener('change', event => {
  if (event.target.id === 'workspaceCategory') {
    workspaceCategoryFilter = event.target.value;
    renderWorkspaceCards();
    return;
  }
  if (event.target.id === 'actionWorkspace') {
    actionWorkspaceScope = event.target.value;
    renderActionOverview($('overlay'));
    $('actionWorkspace').focus();
    return;
  }
  const workspaceId = event.target.dataset.workspaceCategory;
  if (workspaceId && cases.has(workspaceId) &&
      (workspaceCategories.has(event.target.value) || event.target.value === uncategorized)) {
    cases.get(workspaceId).category = event.target.value;
    renderWorkspaceCards();
    return;
  }
  const status = event.target.dataset.actionStatus;
  if (!statuses.includes(status)) return;
  if (event.target.checked) actionStatusFilter.add(status);
  else actionStatusFilter.delete(status);
  renderActionRows();
});
$('overlay').addEventListener('submit', event => {
  const form = event.target;
  if (!form.matches('[data-create-category], [data-rename-category]')) return;
  event.preventDefault();
  editWorkspaceCategory(form.dataset.renameCategory, form.elements.categoryName.value);
});
$('overlay').addEventListener('click', event => {
  const remove = event.target.closest('[data-remove-category]');
  if (remove) {
    removeWorkspaceCategory(remove.dataset.removeCategory);
    return;
  }
  const filter = event.target.closest('[data-status-filter]');
  if (filter) {
    actionStatusFilter.clear();
    const selectAll = filter.dataset.statusFilter === 'all';
    if (selectAll) statuses.forEach(status => actionStatusFilter.add(status));
    $('overlay').querySelectorAll('[data-action-status]').forEach(input => { input.checked = selectAll; });
    renderActionRows();
    return;
  }
  const jump = event.target.closest('[data-jump]');
  if (jump) {
    if (jump.dataset.actionWorkspace !== currentId) switchCase(jump.dataset.actionWorkspace);
    const node = find(jump.dataset.jump);
    if (!node) return;
    cur().collapsed[node.cat] = false;
    viewPage('canvas');
    selectNode(node.id);
    const viewport = $('viewport'), card = position(node), zoom = cur().zoom;
    viewport.scrollTo({
      left: (card.x + card.w / 2) * zoom - viewport.clientWidth / 2,
      top: (card.y + card.h / 2) * zoom - viewport.clientHeight / 2,
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
    });
    return;
  }
  const workspace = event.target.closest('[data-casejump]');
  if (workspace) switchCase(workspace.dataset.casejump);
});
$('drawerContent').addEventListener('input',e=>{let t=e.target.closest('[data-edit]');if(!t)return;const field=t.dataset.edit;let id=selected;let n=find(id);if(!n)return;n[field]=t.value;if(field!=='sideNote'){renderCards();drawLinks()}else hideTooltip()});$('drawerContent').addEventListener('change',e=>{let t=e.target.closest('[data-edit]');if(t){updateNodeField(t.dataset.edit,t.value);if(t.dataset.edit==='status')renderDrawer();}});
$('laneHeaderTrack').addEventListener('click',e=>{const plus=e.target.closest('[data-add-cat]');if(plus){addNode(Number(plus.dataset.addCat));return;}const tog=e.target.closest('[data-collapse]');if(tog){let k=Number(tog.dataset.collapse);saveUndo();const before=snapshotCardRects();cur().collapsed[k]=!cur().collapsed[k];renderAll();animateCardLayout(before);toast(cur().collapsed[k]?'Category hidden · click header to expand':'Category expanded');return;}const lane=e.target.closest('.lane.collapsed');if(lane){saveUndo();cur().collapsed[Number(lane.dataset.cat)]=false;renderAll();toast('Category expanded from header')}});
$('laneHeaderTrack').addEventListener('pointerdown',e=>{const h=e.target.closest('[data-resize-lane]');if(!h)return;e.preventDefault();e.stopPropagation();let k=Number(h.dataset.resizeLane);saveUndo();resizeLane={k,x:e.clientX,w:cur().widths[k],pointer:e.pointerId};});
document.addEventListener('pointermove',e=>{if(resizeLane?.pointer!==e.pointerId)return;let delta=(e.clientX-resizeLane.x)/cur().zoom;cur().widths[resizeLane.k]=Math.max(145,Math.min(370,resizeLane.w+delta));renderAll()});
for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, event => {
  if (resizeLane?.pointer === event.pointerId) resizeLane = null;
});

$('cards').addEventListener('pointerdown',onCardPointerDown);$('cards').addEventListener('pointermove',onCardPointerMove);$('cards').addEventListener('pointerup',onCardPointerUp);
$('cards').addEventListener('pointercancel', cancelCardGesture);
$('cards').addEventListener('lostpointercapture', cancelCardGesture);
installCanvasPan();

$('cards').addEventListener('keydown',e=>{const card=e.target.closest('[data-node-id]');if(card&&!e.target.closest('[data-figure]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectNode(card.dataset.nodeId)}});
$('cards').addEventListener('pointerover',e=>{if(drag||edgeDrag)return;const el=e.target.closest('[data-node-id]');if(!el)return;clearTimeout(tooltipTimer);let id=el.dataset.nodeId;tooltipTimer=setTimeout(()=>showTooltip(find(id),e.clientX,e.clientY),600)});$('cards').addEventListener('pointerout',e=>{if(e.target.closest('[data-node-id]'))hideTooltip()});let lastScroll=0, zoomScrollUntil=0;$('viewport').addEventListener('scroll',()=>{syncLaneHeader();hideTooltip();let v=$('viewport'),y=v.scrollTop;if(Date.now()<zoomScrollUntil){lastScroll=y;return;}if(y===0||Math.abs(y-lastScroll)>4){document.querySelector('.topbar').classList.toggle('hidden',y>80&&y>lastScroll);lastScroll=y;}},{passive:true});

$('addGeneral').addEventListener('click',openCreate);$('cancelCreate').addEventListener('click',()=>$('newModal').classList.remove('open'));$('confirmCreate').addEventListener('click',()=>{const k=Number($('createCategory').value),title=$('createTitle').value.trim();$('newModal').classList.remove('open');addNode(k,title)});$('newModal').addEventListener('click',e=>{if(e.target===$('newModal'))$('newModal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('edgeDialog').open&&!$('figureDialog').open){$('newModal').classList.remove('open');hideTooltip();drawerOpen=false;renderDrawer()}});

document.documentElement.dataset.theme='light';renderAll();enterWorkspace();
