function paddedBox(box, padding) {
  return {left: box.x - padding, top: box.y - padding,
    right: box.x + box.w + padding, bottom: box.y + box.h + padding};
}

function segmentClear(a, b, obstacles) {
  if (a.x === b.x) {
    const [top, bottom] = a.y <= b.y ? [a.y, b.y] : [b.y, a.y];
    return !obstacles.some(r => a.x > r.left && a.x < r.right && top < r.bottom && bottom > r.top);
  }
  const [left, right] = a.x <= b.x ? [a.x, b.x] : [b.x, a.x];
  return !obstacles.some(r => a.y > r.top && a.y < r.bottom && left < r.right && right > r.left);
}

function findRoute(start, end, obstacles) {
  const axis = values => [...new Set(values)].sort((a, b) => a - b);
  const xs = axis([start.x, end.x, ...obstacles.flatMap(r => [r.left, r.right])]);
  const ys = axis([start.y, end.y, ...obstacles.flatMap(r => [r.top, r.bottom])]);
  const sx = xs.indexOf(start.x), sy = ys.indexOf(start.y);
  const tx = xs.indexOf(end.x), ty = ys.indexOf(end.y);
  const key = (x, y, direction) => 2 * (y * xs.length + x) + direction;
  const first = {x: sx, y: sy, direction: 0, cost: 0, score: 0, prev: null};
  const best = new Map([[key(sx, sy, 0), 0]]);
  const queue = [first];
  while (queue.length) {
    let next = 0;
    for (let i = 1; i < queue.length; i++) if (queue[i].score < queue[next].score) next = i;
    const step = queue.splice(next, 1)[0];
    if (step.cost !== best.get(key(step.x, step.y, step.direction))) continue;
    if (step.x === tx && step.y === ty) {
      const result = [];
      for (let at = step; at; at = at.prev) result.push({x: xs[at.x], y: ys[at.y]});
      return result.reverse();
    }
    // A short leftward detour is available when a manually moved card blocks the forward corridor.
    for (const [dx, dy] of [[1, 0], [0, 1], [0, -1], [-1, 0]]) {
      const x = step.x + dx, y = step.y + dy, direction = dx ? 0 : 1;
      if (x < 0 || x >= xs.length || y < 0 || y >= ys.length) continue;
      const a = {x: xs[step.x], y: ys[step.y]}, b = {x: xs[x], y: ys[y]};
      if (!segmentClear(a, b, obstacles)) continue;
      const cost = step.cost + Math.abs(a.x - b.x) + Math.abs(a.y - b.y)
        + (direction === step.direction ? 0 : 18) + (dx < 0 ? 30 : 0);
      const id = key(x, y, direction);
      if (cost >= (best.get(id) ?? Infinity)) continue;
      best.set(id, cost);
      queue.push({x, y, direction, cost, score: cost + Math.abs(b.x - end.x) + Math.abs(b.y - end.y), prev: step});
    }
  }
  return null;
}

function routeLink(edge, boxes) {
  const a = boxes.get(edge.from), b = boxes.get(edge.to);
  const from = {x: a.x + a.w, y: a.y + a.h / 2};
  const to = {x: b.x, y: b.y + b.h / 2};
  const start = {x: from.x + clearance, y: from.y};
  const end = {x: to.x - clearance, y: to.y};
  const otherCards = [...boxes].filter(([id]) => id !== edge.from && id !== edge.to)
    .map(([, box]) => paddedBox(box, clearance));
  if (!segmentClear(from, start, otherCards) || !segmentClear(end, to, otherCards)) return null;
  const obstacles = [...otherCards, paddedBox(a, clearance), paddedBox(b, clearance)];
  const middleX = (start.x + end.x) / 2;
  const direct = [start, {x: middleX, y: start.y}, {x: middleX, y: end.y}, end];
  const route = direct.slice(1).every((point, i) => segmentClear(direct[i], point, obstacles))
    ? direct : findRoute(start, end, obstacles);
  if (!route) return null;
  const points = [];
  for (const point of [from, ...route, to]) {
    const last = points.at(-1), previous = points.at(-2);
    if (last && last.x === point.x && last.y === point.y) continue;
    if (previous && ((previous.x === last.x && last.x === point.x)
      || (previous.y === last.y && last.y === point.y))) points.pop();
    points.push(point);
  }
  return points;
}

function svgElement(tag, attributes) {
  const node = document.createElementNS(svgNS, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  return node;
}

function roundedRoute(points) {
  let d = `M${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const a = points[i - 1], b = points[i], c = points[i + 1];
    const radius = Math.min(5, Math.hypot(b.x - a.x, b.y - a.y) / 2,
      Math.hypot(c.x - b.x, c.y - b.y) / 2);
    const before = [b.x - Math.sign(b.x - a.x) * radius, b.y - Math.sign(b.y - a.y) * radius];
    const after = [b.x + Math.sign(c.x - b.x) * radius, b.y + Math.sign(c.y - b.y) * radius];
    d += ` L${before.join(' ')} Q${b.x} ${b.y} ${after.join(' ')}`;
  }
  return d + ` L${points.at(-1).x} ${points.at(-1).y}`;
}

function drawLinks() {

  cur().edges.forEach((edge, index) => {
    if (!boxes.has(edge.from) || !boxes.has(edge.to)) return;
    const points = routeLink(edge, boxes);
    if (!points) { blocked++; return; }

      svgElement('path', {class: 'edge-ink' + (connected ? ' connected' : ''), d, 'vector-effect': 'non-scaling-stroke'})
    );
    if (edge.label) {
      const ink = group.lastElementChild;
      const length = ink.getTotalLength();
      const label = svgElement('text', {class: 'edge-label'});
      label.textContent = edge.label;
      group.append(label);

      // Try several points on the route so an inline label can remain clear of cards.
      svg.append(group);
      const width = label.getComputedTextLength() + 10;
      const candidates = [.5, .33, .67, .2, .8].map(t => ink.getPointAtLength(t * length));
      const anchor = candidates.find(p => ![...boxes.values()].some(card =>
        p.x + width / 2 > card.x && p.x - width / 2 < card.x + card.w &&
        p.y > card.y && p.y - 16 < card.y + card.h));
      if (anchor) {
        label.setAttribute('x', anchor.x);
        label.setAttribute('y', anchor.y - 3);
      } else {
        label.remove();
      }
    }
    svg.append(group);
  });
  $('routeStatus').textContent = blocked ? `${blocked} link(s) hidden: clear the overlapping card or Auto Arrange` : '';
}

function validTarget(source, target, boxes) {
  if (target.cat <= source.cat || !boxes.has(target.id)) return false;
  const from = boxes.get(source.id), to = boxes.get(target.id);
  return from && to.x >= from.x + from.w + endpointGap &&
    !cur().edges.some(edge => edge.from === source.id && edge.to === target.id);
}

function magnetTarget(source, pointer) {
  const boxes = visibleBoxes();
  let closest = null, best = 33 / cur().zoom;
  for (const node of cur().nodes) {
    if (!validTarget(source, node, boxes)) continue;
    const p = boxes.get(node.id);
    const distance = Math.hypot(pointer.x - p.x, pointer.y - p.y - p.h / 2);
    if (distance >= best) continue;
    best = distance;
    closest = {node, x: p.x, y: p.y + p.h / 2};
  }
  return closest;
}

function previewEdge(pointer) {
  const svg = $('links'), source = find(edgeDrag.from), p = position(source);
  const target = magnetTarget(source, pointer);
  clearEdgePreview();
  const end = target || pointer, x = p.x + p.w, y = p.y + p.h / 2;
  const bend = Math.max(15, Math.abs(end.x - x) * .45);
  const d = `M${x} ${y} C${x + bend} ${y},${end.x - bend} ${end.y},${end.x} ${end.y}`;
  svg.append(svgElement('path', {id: 'edgePreview', class: target ? 'magnetic' : 'preview', d,
    'vector-effect': 'non-scaling-stroke'}));
  if (target) cardElement(target.node.id)?.classList.add('magnet-target');
}

function clearEdgePreview() {
  $('edgePreview')?.remove();
  $('cards').querySelector('.magnet-target')?.classList.remove('magnet-target');
}

function editEdge(index) {
  const edge = cur().edges[index];
  if (!edge) return;
  edgeBeingEdited = edge;
  $('edgeFrom').textContent = find(edge.from).title;
  $('edgeTo').textContent = find(edge.to).title;
  $('edgeRationale').textContent = edge.rationale || 'ความเชื่อมโยงที่เพิ่มใน demo';
  $('edgeLabel').value = edge.label;
  $('edgeDialog').showModal();
}

function inspectorLinks(node) {
  const attached = cur().edges.map((edge, index) => ({edge, index}))
    .filter(({edge}) => edge.from === node.id || edge.to === node.id);
  const boxes = visibleBoxes();
  const targets = cur().nodes.filter(target => validTarget(node, target, boxes));
  return `<div class="edge-list">${attached.map(({edge, index}) => {
    const outgoing = edge.from === node.id;
    const other = find(outgoing ? edge.to : edge.from);
    const detail = edge.label || edge.rationale || '';
    return `<button class="btn" data-edit-edge="${index}">${outgoing ? 'ส่งไปยัง' : 'รับจาก'} ${escapeHTML(other.title)}${detail ? ' · ' + escapeHTML(detail) : ''}</button>`;
  }).join('')}</div>` + (targets.length ? `<div class="field">
    <label for="inspectorTarget">เชื่อมไปยัง Node ขั้นถัดไป</label>
    <select id="inspectorTarget">${targets.map(target => `<option value="${escapeHTML(target.id)}">${escapeHTML(target.title)}</option>`).join('')}</select>
    <button class="btn" data-add-edge>เพิ่มเส้นเชื่อม</button>
  </div>` : '');
}

function addEdge(source, target) {
  if (!source || !target || !validTarget(source, target, visibleBoxes())) return false;
  cur().edges.push({from: source.id, to: target.id, label: '', demo: true});
  renderAll();
  toast('เพิ่มเส้นเชื่อมตัวอย่างแล้ว');
  return true;
}

function installEdgeControls() {
  $('drawerContent').addEventListener('click', event => {
    const edit = event.target.closest('[data-edit-edge]');
    if (edit) editEdge(Number(edit.dataset.editEdge));
    if (event.target.closest('[data-add-edge]')) addEdge(find(selected), find($('inspectorTarget').value));
  });
  $('links').addEventListener('click', event => {
    const edge = event.target.closest('[data-edge]');
    if (edge) editEdge(Number(edge.dataset.edge));
  });
  $('links').addEventListener('keydown', event => {
    const edge = event.target.closest('[data-edge]');
    if (!edge || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    editEdge(Number(edge.dataset.edge));
  });
  $('edgeDialog').querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    if (!edgeBeingEdited) return;
    edgeBeingEdited.label = $('edgeLabel').value.trim();
    $('edgeDialog').close();
    drawLinks();
    renderDrawer();
    toast('บันทึกคำอธิบายเส้นแล้ว');
  });
  $('cancelEdge').addEventListener('click', () => $('edgeDialog').close());
  $('deleteEdge').addEventListener('click', () => {
    const index = cur().edges.indexOf(edgeBeingEdited);
    if (index < 0) return;
    cur().edges.splice(index, 1);
    $('edgeDialog').close();
    renderAll();
    toast('ลบเส้นเชื่อมแล้ว');
  });
  $('edgeDialog').addEventListener('close', () => { edgeBeingEdited = null; });
}

function graphArrange() {
  const c = cur();
  if (!c.nodes.length) return;
  saveUndo();
  const groups = cats.map((_, cat) => c.nodes.filter(node => node.cat === cat));
  if (c.mode === 'snap') {
    packSnap(c);
  } else {
    // Keep the three PDCA work areas near their related stages while leaving
    // a routing aisle between consecutive categories.
    const offsets = [146, 81, 117, 176, 124, 83, 169];
    let x = 38;
    groups.forEach((group, cat) => {
      let y = offsets[cat];
      const extent = Math.max(140, ...group.map(node => node.freeW));
      group.forEach((node, index) => {
        node.freeX = x + (index % 2 ? 23 : 0);
        node.freeY = y;
        y += node.freeH + 34;
      });
      x += extent + (cat === 2 || cat === 4 ? 106 : 64);
    });
  }
  renderAll();
  toast(c.mode === 'snap' ? 'จัดหมวดและจัดเส้นใหม่แล้ว' : 'จัดกลุ่ม Free Float และจัดเส้นใหม่แล้ว');
}

function packSnap(workspace) {
  const nextY = cats.map((_, cat) => cat === 0 ? 200 : 102);
  for (const node of workspace.nodes) {
    node.snapY = nextY[node.cat];
    nextY[node.cat] += snapHeight(node, workspace.widths[node.cat] - 26) + 44;
  }
}

function linkedXBounds(node) {
  let min = 8, maxRight = Infinity;
  for (const edge of cur().edges) {
    if (edge.to === node.id) {
      const source = position(find(edge.from));
      min = Math.max(min, source.x + source.w + endpointGap);
    }
    if (edge.from === node.id) {
      maxRight = Math.min(maxRight, position(find(edge.to)).x - endpointGap);
    }
  }
  return {min, maxRight};
}

function onCardPointerDown(event) {
  if (event.button !== 0 || drag || edgeDrag) return;
  const card = event.target.closest('[data-node-id]');
  if (!card) return;
  const node = find(card.dataset.nodeId);
  card.getAnimations().forEach(animation => animation.cancel());
  const handle = event.target.closest('[data-handle]');
  const resize = event.target.closest('[data-resize]');
  hideTooltip();
  if (handle) {
    if (handle.dataset.handle === 'right') {
      event.preventDefault();
      edgeDrag = {from: node.id, pointer: event.pointerId};
      handle.setPointerCapture(event.pointerId);
    }
    return;
  }
  const type = resize ? 'resize' : 'move';
  drag = {
    type, id: node.id, startX: event.clientX, startY: event.clientY,
    original: position(node), bounds: cur().mode === 'free' ? linkedXBounds(node) : null,
    pointer: event.pointerId, el: card, active: false
  };
  card.setPointerCapture(event.pointerId);
}

function onCardPointerMove(event) {
  if (edgeDrag?.pointer === event.pointerId) {
    previewEdge(screenToWorld(event));
    return;
  }
  if (drag?.pointer !== event.pointerId) return;
  const dx = (event.clientX - drag.startX) / cur().zoom;
  const dy = (event.clientY - drag.startY) / cur().zoom;
  if (!drag.active) {
    if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5) return;
    saveUndo();
    drag.active = true;
    drag.el.classList.add(drag.type === 'resize' ? 'resizing' : 'dragging');
  }
  const node = find(drag.id), p = drag.original;
  if (drag.type === 'resize') {
    const maxWidth = drag.bounds.maxRight - p.x;
    node.freeW = Math.max(Math.min(p.w, 140), Math.min(maxWidth, 500, p.w + dx));
    node.freeH = Math.max(84, Math.min(360, p.h + dy));
  } else if (cur().mode === 'snap') {
    node.snapY = Math.max(66, p.y + dy);
  } else {
    node.freeX = Math.max(drag.bounds.min, Math.min(drag.bounds.maxRight - p.w, p.x + dx));
    node.freeY = Math.max(32, p.y + dy);
  }
  if (!moveRaf) moveRaf = requestAnimationFrame(liveDragVisual);
}

function onCardPointerUp(event) {
  if (edgeDrag?.pointer === event.pointerId) {
    const source = find(edgeDrag.from);
    const target = magnetTarget(source, screenToWorld(event));
    edgeDrag = null;
    clearEdgePreview();
    if (!target) {
      toast('ลากจากจุดขวาไปใกล้จุดซ้ายของ Node ขั้นถัดไป');
      return;
    }
    addEdge(source, target.node);
    return;
  }
  if (drag?.pointer !== event.pointerId) return;
  const finished = drag;
  drag = null;
  if (!finished.active && finished.type === 'move') selectNode(finished.id);
  else if (finished.active) renderAll();
}

function cancelCardGesture(event) {
  if (edgeDrag?.pointer === event.pointerId) {
    edgeDrag = null;
    clearEdgePreview();
  }
  if (drag?.pointer !== event.pointerId) return;
  const changed = drag.active;
  drag = null;
  if (changed) undo();
}

function installCanvasPan() {
  const viewport = $('viewport');
  let pan = null;
  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0 || pan ||
        event.target.closest('.node, .edge-control, .lane-head, .resize-lane, .lane.collapsed')) return;
    if (!$('boardSize').contains(event.target)) return;
    pan = {pointer: event.pointerId, x: event.clientX, y: event.clientY,
      left: viewport.scrollLeft, top: viewport.scrollTop, moved: false, touch: event.pointerType === 'touch'};
    hideTooltip();
    if (!pan.touch) viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener('pointermove', event => {
    if (pan?.pointer !== event.pointerId) return;
    if (!pan.moved && Math.hypot(event.clientX - pan.x, event.clientY - pan.y) < 5) return;
    pan.moved = true;
    if (pan.touch) return;
    viewport.classList.add('panning');
    viewport.scrollLeft = pan.left - event.clientX + pan.x;
    viewport.scrollTop = pan.top - event.clientY + pan.y;
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    viewport.addEventListener(type, event => {
      if (pan?.pointer !== event.pointerId) return;
      const clicked = type === 'pointerup' && !pan.moved &&
        Math.hypot(event.clientX - pan.x, event.clientY - pan.y) < 5;
      pan = null;
      viewport.classList.remove('panning');
      if (clicked && (selected || drawerOpen)) {
        selected = null;
        drawerOpen = false;
        renderCards();
        drawLinks();
        renderDrawer();
      }
    });
  }
}

function enterWorkspace() {
  const viewport = $('viewport');
  viewport.scrollTo({left: 0, top: 0, behavior: 'instant'});
  document.querySelector('.topbar').classList.remove('hidden');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  [...$('cards').children].forEach((card, i) => {
    card.animate([
      {opacity: 0, transform: 'translateY(11px) scale(.94)'},
      {opacity: 1, transform: 'translateY(-2px) scale(1.01)', offset: .78},
      {opacity: 1, transform: 'translateY(0) scale(1)'}
    ], {duration: 370, delay: Math.min(i * 38, 380), easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards'});
  });
}

function updateZoom(v){cur().zoom=Math.min(1.4,Math.max(.65,Math.round(v*100)/100));renderAll();}
function fit(){const width=$('viewport').clientWidth,dim=boxDim(),z=Math.max(.65,Math.min(1.05,(width-24)/dim.width));updateZoom(z);$('viewport').scrollLeft=0;}
function changeWorkspace(w){if(w!==currentId) switchCase(w);}
function resetWhenFirst() {
  for (const workspace of cases.values()) {
    packSnap(workspace);
    for (const node of workspace.nodes) node.initialSnapY = node.snapY;
  }
}
resetWhenFirst();fillMenus();
$('workspaceSelect').addEventListener('change',e=>changeWorkspace(e.target.value));$('search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();renderCards();if(search)toast('Search highlights matching Cards and Side notes')});
$('snapMode').addEventListener('click',()=>switchMode('snap'));$('freeMode').addEventListener('click',()=>switchMode('free'));
$('autoArrange').addEventListener('click',graphArrange);$('undoLayout').addEventListener('click',undo);$('defaultView').addEventListener('click',defaultView);
$('themeToggle').addEventListener('click',()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';$('themeToggle').textContent=dark?'☀':'☾';renderAll()});
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{font=Number(b.dataset.size);document.documentElement.style.setProperty('--fontscale',font);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));renderAll()}));
$('zoomOut').addEventListener('click',()=>updateZoom(cur().zoom-.1));$('zoomIn').addEventListener('click',()=>updateZoom(cur().zoom+.1));$('zoomFit').addEventListener('click',fit);
$('closeDrawer').addEventListener('click',()=>{drawerOpen=false;renderDrawer()});$('inspectNav').addEventListener('click',()=>{if(selected){drawerOpen=!drawerOpen;renderDrawer()}else toast('Select a Node to open Inspector')});
$('actionNav').addEventListener('click',()=>viewPage('actions'));$('canvasNav').addEventListener('click',()=>viewPage('canvas'));$('home').addEventListener('click',()=>viewPage('workspace'));$('helpNav').addEventListener('click',()=>viewPage('help'));

$('overlay').addEventListener('change', event => {
  const status = event.target.dataset.actionStatus;
  if (!statuses.includes(status)) return;
  if (event.target.checked) actionStatusFilter.add(status);
  else actionStatusFilter.delete(status);
  renderActionRows();
});
$('overlay').addEventListener('click', event => {
  const filter = event.target.closest('[data-status-filter]');
  if (filter) {
    actionStatusFilter.clear();
    const selectAll = filter.dataset.statusFilter === 'all';
    if (selectAll) statuses.forEach(status => actionStatusFilter.add(status));
    $('overlay').querySelectorAll('[data-action-status]').forEach(input => { input.checked = selectAll; });
    renderActionRows();
    return;
  }
  const jump = event.target.closest('[data-jump]');
  if (jump) {
    const node = find(jump.dataset.jump);
    if (!node) return;
    cur().collapsed[node.cat] = false;
    viewPage('canvas');
    selectNode(node.id);
    const viewport = $('viewport'), card = position(node), zoom = cur().zoom;
    viewport.scrollTo({
      left: (card.x + card.w / 2) * zoom - viewport.clientWidth / 2,
      top: (card.y + card.h / 2) * zoom - viewport.clientHeight / 2,
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
    });
    return;
  }
  const workspace = event.target.closest('[data-casejump]');
  if (workspace) switchCase(workspace.dataset.casejump);
});
$('drawerContent').addEventListener('input',e=>{let t=e.target.closest('[data-edit]');if(!t)return;const field=t.dataset.edit;let id=selected;let n=find(id);if(!n)return;n[field]=t.value;if(field!=='sideNote'){renderCards();drawLinks()}else hideTooltip()});$('drawerContent').addEventListener('change',e=>{let t=e.target.closest('[data-edit]');if(t){updateNodeField(t.dataset.edit,t.value);if(t.dataset.edit==='status')renderDrawer();}});
$('lanes').addEventListener('click',e=>{const plus=e.target.closest('[data-add-cat]');if(plus){addNode(Number(plus.dataset.addCat));return;}const tog=e.target.closest('[data-collapse]');if(tog){let k=Number(tog.dataset.collapse);saveUndo();cur().collapsed[k]=!cur().collapsed[k];renderAll();toast(cur().collapsed[k]?'Category hidden · click header to expand':'Category expanded');return;}const lane=e.target.closest('.lane.collapsed');if(lane){saveUndo();cur().collapsed[Number(lane.dataset.cat)]=false;renderAll();toast('Category expanded from header')}});
$('lanes').addEventListener('pointerdown',e=>{const h=e.target.closest('[data-resize-lane]');if(!h)return;e.preventDefault();e.stopPropagation();let k=Number(h.dataset.resizeLane);saveUndo();resizeLane={k,x:e.clientX,w:cur().widths[k],pointer:e.pointerId};});
document.addEventListener('pointermove',e=>{if(resizeLane?.pointer!==e.pointerId)return;let delta=(e.clientX-resizeLane.x)/cur().zoom;cur().widths[resizeLane.k]=Math.max(145,Math.min(370,resizeLane.w+delta));renderAll()});
for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, event => {
  if (resizeLane?.pointer === event.pointerId) resizeLane = null;
});

$('cards').addEventListener('pointerdown',onCardPointerDown);$('cards').addEventListener('pointermove',onCardPointerMove);$('cards').addEventListener('pointerup',onCardPointerUp);
$('cards').addEventListener('pointercancel', cancelCardGesture);
$('cards').addEventListener('lostpointercapture', cancelCardGesture);
installCanvasPan();
installEdgeControls();

$('cards').addEventListener('keydown',e=>{const card=e.target.closest('[data-node-id]');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectNode(card.dataset.nodeId)}});
$('cards').addEventListener('pointerover',e=>{if(drag||edgeDrag)return;const el=e.target.closest('[data-node-id]');if(!el)return;clearTimeout(tooltipTimer);let id=el.dataset.nodeId;tooltipTimer=setTimeout(()=>showTooltip(find(id),e.clientX,e.clientY),600)});$('cards').addEventListener('pointerout',e=>{if(e.target.closest('[data-node-id]'))hideTooltip()});let lastScroll=0;$('viewport').addEventListener('scroll',()=>{hideTooltip();let v=$('viewport'),y=v.scrollTop;if(y===0||Math.abs(y-lastScroll)>4){document.querySelector('.topbar').classList.toggle('hidden',y>80&&y>lastScroll);lastScroll=y;}},{passive:true});
function openCreate(){let m=$('newModal');m.classList.add('open');$('createCategory').value='3';$('createTitle').value='';$('createTitle').focus()}
$('addGeneral').addEventListener('click',openCreate);$('cancelCreate').addEventListener('click',()=>$('newModal').classList.remove('open'));$('confirmCreate').addEventListener('click',()=>{const k=Number($('createCategory').value),title=$('createTitle').value.trim();$('newModal').classList.remove('open');addNode(k,title)});$('newModal').addEventListener('click',e=>{if(e.target===$('newModal'))$('newModal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('edgeDialog').open){$('newModal').classList.remove('open');hideTooltip();drawerOpen=false;renderDrawer()}});
// Start at the first synthetic workspace with the canvas unobstructed.
document.documentElement.dataset.theme='light';renderAll();enterWorkspace();
window.__pdcaDemo={getState:()=>({caseId:currentId,mode:cur().mode,nodes:cur().nodes.length,links:cur().edges.length,selected,drawerOpen,collapsed:[...cur().collapsed],widths:[...cur().widths],zoom:cur().zoom}),selectNode,changeMode:switchMode,arrange:graphArrange,defaultView,addNode,switchCase,find,render:renderAll};
})();
</script>
